server {
    listen 8090;
    server_name localhost;
    error_page 404 /home/mari-cruz/Escritorio/webserv/www/errors/404.html;
    error_page 500 /home/mari-cruz/Escritorio/webserv/www/errors/500.html;
    client_max_body_size 1M;

    location / {
        root /home/mari-cruz/Escritorio/webserv/www;
        methods GET POST;
        index index.html;
        autoindex off;
    }

    location /upload {
    root /home/mari-cruz/Escritorio/webserv/www/uploads;
    methods GET POST DELETE;
    upload_store /home/mari-cruz/Escritorio/webserv/www/uploads;
    autoindex on;
    }

    location /cgi-bin {
        root /home/mari-cruz/Escritorio/webserv/www/cgi-bin;
        methods GET POST;
        cgi_pass .php;
    }

    location /old-page {
        return 301 http://www.google.com;
    }

    location /files {
        root /home/mari-cruz/Escritorio/webserv/www/no_file;
        methods GET;
        autoindex off;
    }
}

server {
    listen 8091;
    server_name localhost;
    location / {
        root /home/mari-cruz/Escritorio/webserv/www;
        methods GET;
        index index.html;
        autoindex off;
    }
}