server {
    listen 8090;
    server_name localhost;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    client_max_body_size 1M;

    location / {
        root /home/mari-cruz/Escritorio/webserv/www;
        methods GET POST DELETE;
        index index.html;
        autoindex off;
    }

    location /upload {
    root /home/mari-cruz/Escritorio/webserv/www/uploads;
    methods POST DELETE;
    upload_store /home/mari-cruz/Escritorio/webserv/www/uploads;
    autoindex on;
    }

    location /cgi-bin {
        root /home/mari-cruz/Escritorio/webserv/www/cgi-bin;
        methods GET POST;
        cgi_pass .py;
    }

    location /old-page {
        return 301 /new-page;
    }

    location /files {
        root /home/mari-cruz/Escritorio/webserv/www/no_file;
        methods GET;
        autoindex off;
    }
}
