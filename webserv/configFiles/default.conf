# ══════════════════════════════════════════════════════════════════
#  WEBSERV CONFIG — 42 Madrid
#  Diseñado para cubrir TODOS los casos de corrección
#  Base path: /home/mari-cruz/Escritorio/webserv/webserv/www
# ══════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────
#  SERVIDOR 1 — Puerto 8080 (servidor principal)
# ──────────────────────────────────────────────────────────────────
server {
    listen 8080;
    server_name localhost;

    client_max_body_size 1M;

    error_page 400 /home/mari-cruz/Escritorio/webserv/webserv/errorPages/400.html;
    error_page 403 /home/mari-cruz/Escritorio/webserv/webserv/errorPages/403.html;
    error_page 404 /home/mari-cruz/Escritorio/webserv/webserv/errorPages/404.html;
    error_page 405 /home/mari-cruz/Escritorio/webserv/webserv/errorPages/405.html;
    error_page 413 /home/mari-cruz/Escritorio/webserv/webserv/errorPages/413.html;
    error_page 500 /home/mari-cruz/Escritorio/webserv/webserv/errorPages/500.html;


    # ── Raíz: GET + POST, autoindex ON, index definido
    location / {
        root /home/mari-cruz/Escritorio/webserv/webserv/www;
        methods GET POST;
        index index.html;
        autoindex on;
        upload_store /home/mari-cruz/Escritorio/webserv/webserv/www/uploads;
    }

    # ── Solo GET, autoindex OFF → 403 si no hay index
    location /readonly {
        root /home/mari-cruz/Escritorio/webserv/webserv/www;
        methods GET;
        autoindex off;
        index index.html;
    }

    # ── Directorio con autoindex ON y sin index → lista el contenido
    location /files {
        root /home/mari-cruz/Escritorio/webserv/webserv/www;
        methods GET;
        autoindex on;
    }

    # ── Upload: POST guarda archivo, DELETE lo borra
    location /upload {
        root /home/mari-cruz/Escritorio/webserv/webserv/www/uploads;
        methods GET POST DELETE;
        upload_store /home/mari-cruz/Escritorio/webserv/webserv/www/uploads;
        client_max_body_size 10M;
        autoindex on;
    }

    # ── POST con límite pequeño para forzar 413
    location /post_body {
        root /home/mari-cruz/Escritorio/webserv/webserv/www;
        methods POST;
        client_max_body_size 100;
    }

    # ── CGI con .php y .py
    location /cgi-bin {
        root /home/mari-cruz/Escritorio/webserv/webserv/www/cgi-bin;
        methods GET POST;
        cgi_pass .py;
        cgi_pass .php;
    }

    # ── Redirect 301 permanente
    location /old-page {
        return 301 /new-page;
    }

    # ── Redirect 302 temporal
    location /temp {
        return 302 /;
    }

    # ── Destino del redirect 301
    location /new-page {
        root /home/mari-cruz/Escritorio/webserv/webserv/www;
        methods GET;
        index index.html;
    }
    location /directory {
    root /home/mari-cruz/Escritorio/webserv/webserv/www;
    methods GET;
    index index.html;
    autoindex off;
}
}

# ──────────────────────────────────────────────────────────────────
#  SERVIDOR 2 — Puerto 8081 (servidor secundario)
#  Prueba: múltiples server blocks, config distinta
# ──────────────────────────────────────────────────────────────────
server {
    listen 8081;
    server_name test.localhost;

    client_max_body_size 500;

    location / {
        root /home/mari-cruz/Escritorio/webserv/webserv/www2;
        methods GET;
        index index.html;
        autoindex off;
    }

    # ── POST con límite muy pequeño → fácil de forzar 413
    location /post-test {
        root /home/mari-cruz/Escritorio/webserv/webserv/www2;
        methods POST;
        client_max_body_size 100;
    }
    location /cgi-bin {
        root /home/mari-cruz/Escritorio/webserv/webserv/www/cgi-bin;
        methods GET POST;
        cgi_pass .php;
    }
}
