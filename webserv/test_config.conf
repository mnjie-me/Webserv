server {
    listen 8080;
    server_name localhost;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    client_max_body_size 1M;

    location / {
        root /var/www/html;
        methods GET POST;
        index index.html;
        autoindex off;
    }

    location /upload {
        root /var/www/uploads;
        methods POST DELETE;
        upload_store /var/www/uploads;
    }

    location /cgi-bin {
        root /home/mari-cruz/Escritorio/webserv/www/cgi-bin;
        methods GET POST;
        cgi_pass .py;
    }

    location /old-page {
        return 301 /new-page;
    }
}